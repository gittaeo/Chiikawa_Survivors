<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>치이카와 토벌 산책 · 캐릭터 도감</title><style>*{box-sizing:border-box}body{margin:0;padding:34px;background:radial-gradient(at 50% 0%,#31545c,#101c2d);color:#f5e6c7;font-family:'Malgun Gothic',sans-serif}main{max-width:1120px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}h1{margin:8px 0;font-size:32px}header p{color:#c6d6cd;font-size:13px}.eyebrow{letter-spacing:3px;color:#d5b777;font-size:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{background:linear-gradient(140deg,#354e57,#223443);border:1px solid #82948b66;border-radius:18px;padding:15px;min-height:255px;position:relative;overflow:hidden}canvas{display:block;width:160px;height:130px;margin:auto}h2{font-size:17px;margin:6px 0;color:#ffe8b8}p{font-size:10px;line-height:1.7;color:#bdcec6;margin:6px 0}strong{font-size:11px;color:#e9c995}.stats{color:#d4dfda;font-size:9px}.note{margin-top:20px;font-size:10px;color:#b1c4bc}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:20px}h1{font-size:24px}}</style><main><header><div><span class="eyebrow">CHIIKAWA FAN ADVENTURE · CHARACTER GUIDE</span><h1>함께 모험할 11명의 친구들</h1><p>서로 다른 무기와 고유 능력으로 만드는 나만의 생존 조합</p></div></header><section class="grid" id="roster"></section><p class="note">비공식 팬게임의 실제 렌더링 · 캐릭터 권리는 각 원권리자에게 있습니다. 무기·능력은 팬게임 창작을 포함합니다.</p></main><script type="module">import{CAST}from'./chiikawa-content.mjs';import{TRAITS}from'./progression.mjs';import{loadCast,drawHero}from'./rescue-art.mjs';await loadCast();for(const[id,h]of Object.entries(CAST)){const card=document.createElement('article'),c=document.createElement('canvas');c.width=320;c.height=260;drawHero(c.getContext('2d'),160,199,{hero:id,time:0,scale:2.1});card.append(c);for(const[tag,text]of[['h2',h.name],['p',h.species],['strong',TRAITS[id].name],['p',TRAITS[id].desc],['p',`HP ${h.hp} · 이동 ${h.speed} · ${TRAITS[id].synergy}`]]){const e=document.createElement(tag);e.textContent=text;card.append(e)}document.querySelector('#roster').append(card);}</script></html>
